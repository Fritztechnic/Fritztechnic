<svg xmlns="http://www.w3.org/2000/svg" width="830" height="590" viewBox="0 0 830 590" font-family="'Noto Sans', 'Segoe UI', 'Open Sans', -apple-system, Helvetica, Arial, sans-serif">
<rect width="830" height="590" fill="#0d0f13"/>
<rect x="0.5" y="0.5" width="829" height="589" fill="none" stroke="#2a2f38"/>
<line x1="0" y1="260.5" x2="830" y2="260.5" stroke="#2a2f38"/><line x1="415.5" y1="260" x2="415.5" y2="590" stroke="#2a2f38"/><g transform="translate(0,0)">
<rect x="28" y="0" width="48" height="2" fill="#d10606"/>
<text x="28" y="38" font-size="11" letter-spacing="2" fill="#8b949e" font-weight="600">01  /  HOSTING PLATFORM</text>
<line x1="28" y1="52" x2="802" y2="52" stroke="#2a2f38"/>
<text x="28" y="90" font-size="21" font-weight="600" fill="#fff">VioServe</text>
<text x="28" y="116" font-size="10" letter-spacing="0.8" fill="#ff5a5a" font-weight="600">INFRASTRUCTURE · SOFTWARE DEVELOPMENT · HOSTING</text>
<text x="28" y="146" font-size="14" fill="#c9d1d9">An independent hosting project focused on game servers and VPS infrastructure. Building the platform behind</text>
<text x="28" y="168" font-size="14" fill="#c9d1d9">the service — from backend applications and APIs to virtualization, networking and monitoring.</text>
<line x1="28" y1="208" x2="802" y2="208" stroke="#2a2f38"/><text x="28" y="236" font-size="11" letter-spacing="1.8" font-weight="600" fill="#fff">VISIT VIOSERVE</text><g transform="translate(794,226)" fill="none" stroke="#d10606" stroke-width="1.8" stroke-linecap="square"><path d="M1 1l5 5-5 5"/></g>
</g><g transform="translate(0,260)">
<rect x="28" y="0" width="48" height="2" fill="#d10606"/>
<text x="28" y="38" font-size="11" letter-spacing="2" fill="#8b949e" font-weight="600">02  /  ROBOTICS &amp; SIMULATION</text>
<line x1="28" y1="52" x2="387" y2="52" stroke="#2a2f38"/>
<text x="28" y="90" font-size="21" font-weight="600" fill="#fff">Robotarm Simulator</text>
<text x="28" y="116" font-size="10" letter-spacing="0.8" fill="#ff5a5a" font-weight="600">RUST · ROBOTICS · INVERSE KINEMATICS</text>
<text x="28" y="146" font-size="14" fill="#c9d1d9">A 6-DOF robotic arm simulator built in Rust using</text>
<text x="28" y="168" font-size="14" fill="#c9d1d9">egui and wgpu. Implements forward and inverse</text>
<text x="28" y="190" font-size="14" fill="#c9d1d9">kinematics, trajectory planning, interactive 3D</text>
<text x="28" y="212" font-size="14" fill="#c9d1d9">manipulation and automated movement sequences.</text>
<line x1="28" y1="278" x2="387" y2="278" stroke="#2a2f38"/><text x="28" y="306" font-size="11" letter-spacing="1.8" font-weight="600" fill="#fff">VIEW SOURCE CODE</text><g transform="translate(379,296)" fill="none" stroke="#d10606" stroke-width="1.8" stroke-linecap="square"><path d="M1 1l5 5-5 5"/></g>
</g><g transform="translate(415,260)">
<rect x="28" y="0" width="48" height="2" fill="#d10606"/>
<text x="28" y="38" font-size="11" letter-spacing="2" fill="#8b949e" font-weight="600">03  /  DIGITAL LOGIC</text>
<line x1="28" y1="52" x2="387" y2="52" stroke="#2a2f38"/>
<text x="28" y="90" font-size="21" font-weight="600" fill="#fff">Logic Sandbox</text>
<text x="28" y="116" font-size="10" letter-spacing="0.8" fill="#ff5a5a" font-weight="600">TYPESCRIPT · DIGITAL LOGIC · COMPUTER ARCHITECTURE</text>
<text x="28" y="146" font-size="14" fill="#c9d1d9">An interactive browser-based digital circuit</text>
<text x="28" y="168" font-size="14" fill="#c9d1d9">simulator. Explore logic gates, adders, registers</text>
<text x="28" y="190" font-size="14" fill="#c9d1d9">and complete CPU architectures — including 8-bit</text>
<text x="28" y="212" font-size="14" fill="#c9d1d9">and 32-bit RISC processors — with interactive</text>
<text x="28" y="234" font-size="14" fill="#c9d1d9">circuits and an integrated assembly tutorial.</text>
<line x1="28" y1="278" x2="387" y2="278" stroke="#2a2f38"/><text x="28" y="306" font-size="11" letter-spacing="1.8" font-weight="600" fill="#fff">OPEN LIVE DEMO</text><g transform="translate(379,296)" fill="none" stroke="#d10606" stroke-width="1.8" stroke-linecap="square"><path d="M1 1l5 5-5 5"/></g>
</g>
</svg>