<line x1="28" y1="52" x2="382" y2="52" stroke="#2a2f38"/>
<text x="28" y="90" font-size="21" font-weight="700" fill="#fff">Robotarm Simulator</text>
<text x="28" y="116" font-size="10" letter-spacing="0.8" fill="#ff5a5a" font-weight="600">RUST · ROBOTICS · INVERSE KINEMATICS</text>
<text x="28" y="146" font-size="14" fill="#c9d1d9">A 6-DOF robotic arm simulator built in Rust using</text>
<text x="28" y="168" font-size="14" fill="#c9d1d9">egui and wgpu. Implements forward and inverse</text>
<text x="28" y="190" font-size="14" fill="#c9d1d9">kinematics, trajectory planning, interactive 3D</text>
<text x="28" y="212" font-size="14" fill="#c9d1d9">manipulation and automated movement sequences.</text>
